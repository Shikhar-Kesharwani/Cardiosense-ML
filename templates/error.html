<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - CardioAI</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <!-- 3D Background Container -->
    <div id="canvas-container"></div>

    <main class="dashboard">
        <header class="dashboard-header">
            <div class="logo">
                <i class="fa-solid fa-heart-pulse"></i>
                <h1>CardioAI <span>Predictor</span></h1>
            </div>
        </header>

        <section class="result-container">
            <div class="glass-panel result-card danger" style="border-color: #f59e0b; box-shadow: 0 0 30px rgba(245, 158, 11, 0.2);">
                <div class="result-icon" style="color: #f59e0b; animation: none;">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h1>Analysis Error</h1>
                <p>{{ error_message }}</p>
                <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Return Home</a>
            </div>
        </section>
    </main>

    <!-- Three.js for 3D Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="{{ url_for('static', filename='3d_heart.js') }}"></script>
</body>
</html>
