<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction - Dual AI Analysis</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .toggle-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 15px;
        }
        .toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
        }
        .toggle-btn.active {
            background: rgba(255, 100, 100, 0.5);
            border-color: rgba(255, 100, 100, 0.8);
            box-shadow: 0 0 10px rgba(255, 100, 100, 0.5);
        }
    </style>
</head>
<body>
    <!-- 3D Background Container -->
    <div id="canvas-container"></div>

    <!-- Main Content -->
    <main class="dashboard">
        <header class="dashboard-header">
            <div class="logo">
                <i class="fa-solid fa-heart-pulse"></i>
                <h1>CardioAI <span>Predictor</span></h1>
            </div>
            <p class="subtitle">Dual-Model Machine Learning Diagnostics</p>
        </header>

        <section class="glass-panel form-section">
            
            <div class="toggle-container" style="flex-wrap: wrap;">
                <button id="btn-cdc" class="toggle-btn active" onclick="toggleForm('cdc')">Mode 1: Quick Public Health</button>
                <button id="btn-clinical" class="toggle-btn" onclick="toggleForm('clinical')">Mode 2: Basic Physical</button>
                <button id="btn-nhanes" class="toggle-btn" onclick="toggleForm('nhanes')">Mode 3: Advanced Lab Diagnosis</button>
                <button id="btn-brfss" class="toggle-btn" onclick="toggleForm('brfss')">Mode 4: Deep Lifestyle Analysis</button>
            </div>


            <!-- CLINICAL FORM -->
            <form action="/predict_clinical" method="post" class="grid-form" id="clinical-form" style="display: none;">
                <div class="form-group">
                    <label for="age"><i class="fa-solid fa-calendar"></i> Age (in days)</label>
                    <input type="number" name="age" id="age" required placeholder="e.g. 18393">
                </div>
                <div class="form-group">
                    <label for="gender"><i class="fa-solid fa-venus-mars"></i> Gender (1=Women, 2=Men)</label>
                    <select name="gender" id="gender" required>
                        <option value="1">Women</option>
                        <option value="2">Men</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="height"><i class="fa-solid fa-ruler-vertical"></i> Height (cm)</label>
                    <input type="number" name="height" id="height" required placeholder="e.g. 168">
                </div>
                <div class="form-group">
                    <label for="weight"><i class="fa-solid fa-weight-scale"></i> Weight (kg)</label>
                    <input type="number" step="0.1" name="weight" id="weight" required placeholder="e.g. 62.0">
                </div>
                <div class="form-group">
                    <label for="ap_hi"><i class="fa-solid fa-heart-pulse"></i> Systolic BP (ap_hi)</label>
                    <input type="number" name="ap_hi" id="ap_hi" required placeholder="e.g. 110">
                </div>
                <div class="form-group">
                    <label for="ap_lo"><i class="fa-solid fa-heart-pulse"></i> Diastolic BP (ap_lo)</label>
                    <input type="number" name="ap_lo" id="ap_lo" required placeholder="e.g. 80">
                </div>
                <div class="form-group">
                    <label for="cholesterol"><i class="fa-solid fa-burger"></i> Cholesterol</label>
                    <select name="cholesterol" id="cholesterol" required>
                        <option value="1">1 - Normal</option>
                        <option value="2">2 - Above Normal</option>
                        <option value="3">3 - Well Above Normal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="gluc"><i class="fa-solid fa-cubes-stacked"></i> Glucose</label>
                    <select name="gluc" id="gluc" required>
                        <option value="1">1 - Normal</option>
                        <option value="2">2 - Above Normal</option>
                        <option value="3">3 - Well Above Normal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="smoke"><i class="fa-solid fa-smoking"></i> Smoking</label>
                    <select name="smoke" id="smoke" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="alco"><i class="fa-solid fa-wine-glass"></i> Alcohol intake</label>
                    <select name="alco" id="alco" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="active"><i class="fa-solid fa-person-running"></i> Physical activity</label>
                    <select name="active" id="active" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="form-actions full-width">
                    <button type="submit" class="glow-button">
                        <i class="fa-solid fa-microchip"></i> Analyze Clinical Data
                    </button>
                </div>
            </form>

            <!-- CDC FORM -->

                    <select name="HighBP" id="HighBP" required>
                        <option value="" disabled selected>Select</option>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="HighChol"><i class="fa-solid fa-burger"></i> High Cholesterol</label>
                    <select name="HighChol" id="HighChol" required>

                        <option value="0">No</option>
                        <option value="1">Yes</option>

                        <option value="0">No</option>
                        <option value="1">Yes</option>

                <div class="form-group">

                    <input type="number" name="BMI" id="BMI" required placeholder="e.g. 25">

                <div class="form-group">

                    <select name="Stroke" id="Stroke" required>

                        <option value="1">Yes</option>

                <div class="form-group">
                    <label for="Diabetes"><i class="fa-solid fa-syringe"></i> Diabetes Status</label>
                    <select name="Diabetes" id="Diabetes" required>
                        <option value="" disabled selected>Select</option>
                        <option value="0">No Diabetes</option>
                        <option value="1">Pre-diabetes</option>
                        <option value="2">Diabetes</option>

                </div>

                <div class="form-group">
                    <label for="PhysActivity"><i class="fa-solid fa-person-running"></i> Physical Activity (Past 30 days)</label>
                    <select name="PhysActivity" id="PhysActivity" required>
                        <option value="" disabled selected>Select</option>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="Fruits"><i class="fa-solid fa-apple-whole"></i> Consume Fruit 1+ Times/Day</label>
                    <select name="Fruits" id="Fruits" required>
                        <option value="" disabled selected>Select</option>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="Veggies"><i class="fa-solid fa-carrot"></i> Consume Veggies 1+ Times/Day</label>
                    <select name="Veggies" id="Veggies" required>
                        <option value="" disabled selected>Select</option>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="HvyAlcoholConsump"><i class="fa-solid fa-wine-glass"></i> Heavy Alcohol Consumer</label>
                    <select name="HvyAlcoholConsump" id="HvyAlcoholConsump" required>
                        <option value="" disabled selected>Select</option>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="form-group">

                    <select name="AnyHealthcare" id="AnyHealthcare" required>
                        <option value="" disabled selected>Select</option>

                        <option value="1">Yes</option>

                </div>

                <div class="form-group">

                        <option value="" disabled selected>Select</option>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="form-group">

                    <select name="GenHlth" id="GenHlth" required>
                        <option value="" disabled selected>Select Rating</option>
                        <option value="1">1 - Excellent</option>
                        <option value="2">2 - Very Good</option>
                        <option value="3">3 - Good</option>
                        <option value="4">4 - Fair</option>
                        <option value="5">5 - Poor</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="MentHlth"><i class="fa-solid fa-face-frown"></i> Poor Mental Health Days (0-30)</label>
                    <input type="number" name="MentHlth" id="MentHlth" required min="0" max="30" placeholder="e.g. 2">
                </div>

                <div class="form-group">
                    <label for="PhysHlth"><i class="fa-solid fa-crutch"></i> Poor Physical Health Days (0-30)</label>
                    <input type="number" name="PhysHlth" id="PhysHlth" required min="0" max="30" placeholder="e.g. 5">
                </div>

                <div class="form-group">
                    <label for="DiffWalk"><i class="fa-solid fa-wheelchair"></i> Difficulty Walking</label>
                    <select name="DiffWalk" id="DiffWalk" required>
                        <option value="" disabled selected>Select</option>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="Sex"><i class="fa-solid fa-venus-mars"></i> Sex</label>
                    <select name="Sex" id="Sex" required>
                        <option value="" disabled selected>Select</option>
                        <option value="0">Female</option>
                        <option value="1">Male</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="Age"><i class="fa-solid fa-calendar"></i> Age Category (1-13)</label>
                    <select name="Age" id="Age" required>
                        <option value="" disabled selected>Select</option>
                        <option value="1">18-24</option>
                        <option value="2">25-29</option>
                        <option value="3">30-34</option>
                        <option value="4">35-39</option>
                        <option value="5">40-44</option>
                        <option value="6">45-49</option>
                        <option value="7">50-54</option>
                        <option value="8">55-59</option>
                        <option value="9">60-64</option>
                        <option value="10">65-69</option>
                        <option value="11">70-74</option>
                        <option value="12">75-79</option>
                        <option value="13">80+</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="Education"><i class="fa-solid fa-graduation-cap"></i> Education Level (1-6)</label>
                    <select name="Education" id="Education" required>
                        <option value="" disabled selected>Select</option>
                        <option value="1">Never Attended</option>
                        <option value="2">Grades 1-8</option>
                        <option value="3">Grades 9-11</option>
                        <option value="4">High School Grad</option>
                        <option value="5">Some College</option>
                        <option value="6">College Grad</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="Income"><i class="fa-solid fa-sack-dollar"></i> Income Bracket (1-8)</label>
                    <select name="Income" id="Income" required>
                        <option value="" disabled selected>Select</option>
                        <option value="1">&lt; $10k</option>
                        <option value="2">$10k - $15k</option>
                        <option value="3">$15k - $20k</option>
                        <option value="4">$20k - $25k</option>
                        <option value="5">$25k - $35k</option>
                        <option value="6">$35k - $50k</option>
                        <option value="7">$50k - $75k</option>
                        <option value="8">&gt; $75k</option>
                    </select>
                </div>

                <div class="form-actions full-width">
                    <button type="submit" class="glow-button">
                        <i class="fa-solid fa-microchip"></i> Analyze Public Health Data
                    </button>
                </div>
            </form>
        
            <!-- NHANES FORM -->
            <form action="/predict_nhanes" method="post" class="grid-form" id="nhanes-form" style="display: none;">
                <div class="form-group">
    <label for="RIDAGEYR">Age (Years)</label>
    <input type="number" name="RIDAGEYR" id="RIDAGEYR" required min="0" max="120" placeholder="e.g. 50">
</div>
<div class="form-group">
    <label for="RIAGENDR">Gender</label>
    <select name="RIAGENDR" id="RIAGENDR" required>
        <option value="1">Male</option>
        <option value="2">Female</option>
    </select>
</div>
<div class="form-group">
    <label for="BMXBMI">Body Mass Index (BMI)</label>
    <input type="number" step="0.1" name="BMXBMI" id="BMXBMI" required placeholder="e.g. 25.5">
</div>
<div class="form-group">
    <label for="BPXSY1">Systolic Blood Pressure (mmHg)</label>
    <input type="number" name="BPXSY1" id="BPXSY1" required placeholder="e.g. 120">
</div>
<div class="form-group">
    <label for="BPXDI1">Diastolic Blood Pressure (mmHg)</label>
    <input type="number" name="BPXDI1" id="BPXDI1" required placeholder="e.g. 80">
</div>
<div class="form-group">
    <label for="LBXTR">Triglycerides (mg/dL)</label>
    <input type="number" name="LBXTR" id="LBXTR" required placeholder="e.g. 150">
</div>
<div class="form-group">
    <label for="LBDHDD">HDL Cholesterol (mg/dL)</label>
    <input type="number" step="0.1" name="LBDHDD" id="LBDHDD" required placeholder="e.g. 45.0">
</div>
<div class="form-group">
    <label for="LBXGLU">Fasting Glucose (mg/dL)</label>
    <input type="number" step="0.1" name="LBXGLU" id="LBXGLU" required placeholder="e.g. 95.0">
</div>
<div class="form-group">
    <label for="LBXCRP">C-Reactive Protein (mg/L)</label>
    <input type="number" step="0.1" name="LBXCRP" id="LBXCRP" required placeholder="e.g. 1.5">
</div>
<div class="form-group">
    <label for="LBXTC">Total Cholesterol (mg/dL)</label>
    <input type="number" step="0.1" name="LBXTC" id="LBXTC" required placeholder="e.g. 180.0">
</div>
<div class="form-group">
    <label for="LBXWBCSI">White Blood Cell Count (1000 cells/uL)</label>
    <input type="number" step="0.1" name="LBXWBCSI" id="LBXWBCSI" required placeholder="e.g. 6.5">
</div>

                <div class="form-actions full-width">
                    <button type="submit" class="glow-button">
                        <i class="fa-solid fa-microchip"></i> Analyze NHANES Data
                    </button>
                </div>
            </form>

    <script>
        function toggleForm(type) {
            const forms = ['clinical', 'cdc', 'nhanes', 'brfss'];
            forms.forEach(f => {
                document.getElementById(f + '-form').style.display = 'none';
                document.getElementById('btn-' + f).classList.remove('active');
            });
            
            document.getElementById(type + '-form').style.display = 'grid';
            document.getElementById('btn-' + type).classList.add('active');
        }
    </script>
