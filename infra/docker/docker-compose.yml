# ─────────────────────────────────────────────────────────────────────────────
# Model 2 — Self-Hosted Docker Compose Stack
# CardioSense ML — Full Application Stack
#
# Usage:
#   cp infra/docker/.env.example infra/docker/.env   # fill in real values
#   docker-compose -f infra/docker/docker-compose.yml up -d
#
# Access:
#   App:          http://localhost:80
#   MinIO Admin:  http://localhost:9001
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── Application (Flask + Gunicorn + ML Models) ───────────────────────────
  app:
    build:
      context: ../../          # Project root — where Dockerfile lives
      dockerfile: Dockerfile
    container_name: cardiosense_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-7860}:${APP_PORT:-7860}"
    environment:
      - PORT=${APP_PORT:-7860}
      - FLASK_DEBUG=false
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET_NAME=${MINIO_BUCKET:-cardiosense-uploads}
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_REGION=us-east-1
      - SECRET_KEY=${SECRET_KEY:-replace_with_a_long_random_string}
    depends_on:
      minio:
        condition: service_started
    volumes:
      - app_logs:/home/user/app/logs
    networks:
      - cardiosense_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Object Storage (MinIO — Self-Hosted S3-Compatible) ───────────────────
  minio:
    image: minio/minio:latest
    container_name: cardiosense_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"    # S3 API endpoint
      - "9001:9001"    # MinIO web console
    networks:
      - cardiosense_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Reverse Proxy (Nginx) ─────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cardiosense_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - app
    networks:
      - cardiosense_network

volumes:
  minio_data:
    driver: local
  app_logs:
    driver: local
  nginx_certs:
    driver: local

networks:
  cardiosense_network:
    driver: bridge
