server {
    listen 80;
    server_name _;

    # Increase upload limit for any future file upload functionality
    client_max_body_size 50M;

    # Forward all traffic to the Flask application container
    location / {
        proxy_pass http://cardiosense_app:7860;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — ML inference can take a few seconds
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # Static files served directly by Nginx (bypasses Flask for speed)
    location /static/ {
        proxy_pass http://cardiosense_app:7860/static/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://cardiosense_app:7860/;
        access_log off;
    }
}
