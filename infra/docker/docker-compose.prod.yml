# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml — Production Hardening Overrides
#
# Usage (on a VPS / cloud VM):
#   docker-compose -f infra/docker/docker-compose.yml \
#                  -f infra/docker/docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  app:
    # Use pre-built image from a registry in production instead of building locally
    # image: ghcr.io/shikhar-kesharwani/cardiosense-ml:latest
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G          # Cap memory; ML models need ~2GB
          cpus: '2.0'
    environment:
      - FLASK_DEBUG=false
      - SECRET_KEY=${SECRET_KEY}   # MUST be set in production .env
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  minio:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  nginx:
    restart: always
    # In production, mount real SSL certificates from Let's Encrypt / Certbot
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/nginx/certs:ro   # Certbot certs path
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
